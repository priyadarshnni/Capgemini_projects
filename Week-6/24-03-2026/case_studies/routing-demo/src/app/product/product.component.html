<h1>Product List</h1>

<table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let product of products">
      <td>{{ product.productId }}</td>
      <td>
        <a [routerLink]="['/product', product.productId]">
          {{ product.Name }}
        </a>
      </td>
      <td>{{ product.Price }}</td>
    </tr>
  </tbody>
</table>
